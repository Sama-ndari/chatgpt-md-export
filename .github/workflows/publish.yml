name: Publish extension

# Publishing runs on a version tag so the published version always matches a
# commit. The extension is packaged once and the same archive goes to both
# registries, so VS Code and the forks that read Open VSX get identical bytes.
#
# The Visual Studio Marketplace uses Trusted Publishing: GitHub's OIDC token is
# exchanged for a short-lived credential, so no Personal Access Token is stored
# here. Open VSX has no OIDC support, so it needs the OVSX_PAT secret.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package the extension
        working-directory: packages/extension
        run: npx --yes @vscode/vsce@4 package --no-dependencies --out extension.vsix
      - name: Publish to the Visual Studio Marketplace
        working-directory: packages/extension
        run: npx --yes @vscode/vsce@4 publish --oidc --packagePath extension.vsix
      # Skipped until OVSX_PAT exists, so a release never fails over a missing
      # secret. Open VSX feeds Cursor, Windsurf and VSCodium.
      - name: Publish to Open VSX
        if: ${{ secrets.OVSX_PAT != '' }}
        working-directory: packages/extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1 publish extension.vsix --pat "$OVSX_PAT"
