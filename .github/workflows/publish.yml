name: Publish extension

# Publishing runs on a version tag so the published version always matches a
# commit. The extension is packaged once and the same archive goes to both
# registries, so VS Code and the forks that read Open VSX get identical bytes.
#
# Both registries use Trusted Publishing: GitHub's OIDC token is exchanged for a
# short-lived credential at publish time, so no Personal Access Token is stored
# in this repository. Each registry matches the token against a registration
# naming this repository and this workflow file, so renaming this file breaks
# publishing until the registration is updated.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package the extension
        working-directory: packages/extension
        run: npx --yes @vscode/vsce@4 package --no-dependencies --out extension.vsix
      - name: Publish to the Visual Studio Marketplace
        working-directory: packages/extension
        run: npx --yes @vscode/vsce@4 publish --oidc --packagePath extension.vsix
      # Open VSX feeds Cursor, Windsurf and VSCodium, which cannot read the
      # Visual Studio Marketplace.
      - name: Publish to Open VSX
        working-directory: packages/extension
        run: npx --yes ovsx@1 publish extension.vsix --trusted-publishing
